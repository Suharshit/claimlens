# Shape of inventory/hosts.ini, which Terraform writes (S5A) and git ignores.
# For existing servers (S5C), copy this to hosts.ini and fill in real IPs.
[lb]
lb-1 ansible_host=203.0.113.10 private_ip=172.31.0.10

[app]
app-1 ansible_host=203.0.113.11 private_ip=172.31.0.11
app-2 ansible_host=203.0.113.12 private_ip=172.31.0.12

[ops]
ops-1 ansible_host=203.0.113.20 private_ip=172.31.0.20

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
