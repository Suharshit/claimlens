# On WSL under /mnt/<drive> this folder is world-writable and Ansible ignores
# this file unless ANSIBLE_CONFIG points at it (the Makefile does that).
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
