# Source artifact: tarball → per-release folder with its own venv → "current" symlink.
- name: Check that a version was given
  ansible.builtin.assert:
    that: app_version is defined and app_version | length > 0
    fail_msg: "Pass a version: -e app_version=v1.0.0 (a tag on the Releases page)"
    quiet: true

- name: Install Python and the packages the app needs
  ansible.builtin.apt:
    name: "{{ ['python3', 'python3-venv'] + app_system_packages }}"
    state: present

- name: Create a system user for the app
  ansible.builtin.user:
    name: "{{ app_name }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the releases folder (root-owned, read-only to the app)
  ansible.builtin.file:
    path: "{{ app_dir }}/releases"
    state: directory
    mode: "0755"

- name: Create the writable data folders (claim state, run log, temp files)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_name }}"
    group: "{{ app_name }}"
    mode: "0750"
  loop:
    - "{{ app_data_dir }}"
    - "{{ app_data_dir }}/state"
    - "{{ app_data_dir }}/logs"
    - "{{ app_data_dir }}/tmp"

- name: Install the release
  block:
    - name: Download from GitHub Releases (checked against its .sha256)
      ansible.builtin.get_url:
        url: "{{ app_release_url }}"
        dest: "{{ app_release_dir }}.tar.gz"
        checksum: "sha256:{{ app_release_url }}.sha256"
        mode: "0644"
      when: app_install_method == 'release'

    - name: Copy a locally built artifact
      ansible.builtin.copy:
        src: "{{ app_local_artifact }}"
        dest: "{{ app_release_dir }}.tar.gz"
        mode: "0644"
      when: app_install_method == 'copy'

    - name: Create the release folder
      ansible.builtin.file:
        path: "{{ app_release_dir }}"
        state: directory
        mode: "0755"

    - name: Unpack the release (state/ and logs/ come from the data folder instead)
      ansible.builtin.unarchive:
        src: "{{ app_release_dir }}.tar.gz"
        dest: "{{ app_release_dir }}"
        remote_src: true
        creates: "{{ app_release_dir }}/api.py"
        exclude: [state, logs]

    - name: Link state/ and logs/ to the data folder
      ansible.builtin.file:
        src: "{{ app_data_dir }}/{{ item }}"
        dest: "{{ app_release_dir }}/{{ item }}"
        state: link
      loop: [state, logs]

    - name: Install the lean server dependencies into the release's own venv
      ansible.builtin.pip:
        requirements: "{{ app_release_dir }}/requirements-server.txt"
        virtualenv: "{{ app_release_dir }}/.venv"
        virtualenv_command: python3 -m venv

    - name: Point "current" at this version
      ansible.builtin.file:
        src: "{{ app_release_dir }}"
        dest: "{{ app_dir }}/current"
        state: link
        force: true
      notify: Restart app
  rescue:
    - name: Explain the failure
      ansible.builtin.fail:
        msg: >-
          Could not install {{ app_name }} {{ app_version }}. Does that release exist?
          {{ ansible_failed_result.msg | default('') }}

- name: Install the systemd service
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart app

- name: Start the app now and at boot
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    state: started
    enabled: true

- name: Apply pending restarts before checking health
  ansible.builtin.meta: flush_handlers
