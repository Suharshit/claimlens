# Used only when config_owner: ansible. Otherwise Puppet manages nginx (S7).
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Load-balancer config
  ansible.builtin.template:
    src: lb.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Reload nginx

- name: Start nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
