- name: Install Nagios, plugins and the NRPE client
  ansible.builtin.apt:
    name: [nagios4, monitoring-plugins, nagios-nrpe-plugin, apache2]
    state: present

# The Nagios web pages are CGI programs; Ubuntu's nagios4 package doesn't turn the module on,
# and without it Apache sends status.cgi as a download instead of running it.
- name: Enable Apache CGI for the Nagios web UI
  ansible.builtin.command: a2enmod cgi
  register: nagios_a2enmod_cgi
  changed_when: "'already enabled' not in nagios_a2enmod_cgi.stdout"
  notify: Restart apache2

# EC2 servers have no swap, so Ubuntu's default localhost "Swap Usage" check is always CRITICAL;
# -n ok makes "no swap" an OK result (the thresholds still apply if swap is ever added).
- name: Treat "no swap" as OK in the default localhost swap check
  ansible.builtin.replace:
    path: /etc/nagios4/objects/localhost.cfg
    regexp: '(check_local_swap![^!\s]+!\S+)\s*$'
    replace: '\1 -n ok'
  notify: Restart nagios

- name: Allow external commands (Ansible uses this to schedule downtime)
  ansible.builtin.lineinfile:
    path: /etc/nagios4/nagios.cfg
    regexp: '^check_external_commands='
    line: check_external_commands=1
  notify: Restart nagios

- name: Create the local plugins folder
  ansible.builtin.file:
    path: /usr/local/lib/nagios/plugins
    state: directory
    mode: "0755"

- name: Install the custom plugin
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../nagios/plugins/check_app.py"
    dest: /usr/local/lib/nagios/plugins/check_app.py
    mode: "0755"

- name: Hosts, services and commands for this project
  ansible.builtin.template:
    src: project.cfg.j2
    dest: /etc/nagios4/conf.d/{{ app_name }}.cfg
    mode: "0644"
  notify: Restart nagios

- name: Start Nagios
  ansible.builtin.systemd_service:
    name: nagios4
    state: started
    enabled: true
