# ClaimLens configuration — starting values from context/04-ui-and-stack-brief.md.
# Tune thresholds here; never hard-code them in agents or tools.

model:
  temperature: 0          # temperature 0 for intake and decisions

# M1 LLM path: free open-weight models behind OpenAI-compatible APIs (tools/llm_client.py).
# Only the Intake Agent uses it, as a second reading checked by the rules; no money, ever.
# Providers are tried in order. Caps are OUR limits, kept below each free tier; usage is
# counted in paths.llm_usage. `python -m tools.llm_client` shows what's left.
# Providers retire models: `python -m tools.llm_client models` lists what your keys can use now.
# Keys go in .env (GROQ_API_KEY, NVIDIA_API_KEY), never here. CLAIMLENS_LLM=off → rules only.
llm:
  enabled: true           # on, but with no key set it falls back to the rules (CI, servers)
  timeout_s: 30
  max_tokens: 400
  providers:
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: qwen/qwen3.8-27b   # checked 2026-11-10: 10/10 fields agree on claim 1, ~0.6 s
      key_env: GROQ_API_KEY
      json_mode: true
      extra:
        reasoning_format: hidden   # keep any reasoning out of the reply text
      caps:               # Groq free tier (from its x-ratelimit headers): 1,000 RPD, 8K TPM; 30 RPM
        requests_per_minute: 25
        requests_per_day: 900
        tokens_per_minute: 7000
        tokens_per_day: 90000      # conservative: Groq doesn't report a daily token limit in headers
    - name: nvidia
      base_url: https://integrate.api.nvidia.com/v1
      model: nvidia/nemotron-3.5-lightning-30b-a3b   # checked 2026-11-10: 10/10 agree; 3-nano retired 2026-09-01
      key_env: NVIDIA_API_KEY
      json_mode: false
      extra:
        chat_template_kwargs: {enable_thinking: false}   # extraction needs no reasoning trace
      caps:               # build.nvidia.com is credit-metered; these are conservative self-caps
        requests_per_minute: 30
        requests_per_day: 200
        tokens_per_minute: null
        tokens_per_day: null

retrieval:
  top_k: 5
  min_similarity: 0.45

thresholds:
  human_review_amount_inr: 200000   # claims above ₹2,00,000 always go to a human
  fraud_escalate_score: 60          # risk score >= 60 escalates
  min_confidence: 0.6               # manager confidence below this escalates
  overclaim_margin_pct: 10          # M5: claimed > payable by this margin → over-claiming flag

fraud_rules:                        # M6 score_risk: weighted rules, score capped at 100
  soon_after_inception_days: 60     # admission within this many days of cover start
  near_sum_insured_pct: 80          # claimed at or above this % of sum insured
  weights:
    soon_after_inception: 35
    amount_near_sum_insured: 25
    duplicate_bill_number: 40
    short_stay_non_daycare: 20      # admit and discharge on the same day (< 24 h), not a day-care procedure

paths:
  corpus: data/corpus
  chunks: data/corpus/chunks.jsonl
  claims: data/claims
  policies: data/policies.json
  prior_claims: data/prior_claims.json
  state_dir: state
  review_queue: state/review_queue.json
  run_log: logs/run_log.jsonl
  llm_usage: state/llm_usage.json   # LLM usage ledger; NOT a runtime key, so caps hold across notebook/tests/API
