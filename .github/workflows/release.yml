name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Test
        run: pytest
      - name: Build
        run: make build                 # -> dist/claimlens.tar.gz
      - name: Checksums
        working-directory: dist         # bare file name, so Ansible's get_url checksum lookup matches
        run: sha256sum claimlens.tar.gz > claimlens.tar.gz.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/claimlens.tar.gz dist/claimlens.tar.gz.sha256 \
            --title "${GITHUB_REF_NAME}" --generate-notes
